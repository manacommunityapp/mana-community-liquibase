      author: "mana-community-dev"
      labels: "performance,v1.0"
      context: "default"
      comment: "Performance tweaks auth"
      logicalFilePath: "db/changelog/releases/v1.0/202507290002-v1.0-performance.yaml"
      runInTransaction: false
      changes:
        - sql:
            splitStatements: false
            sql: ANALYZE auth.users;
      rollback:
        - empty: {}

