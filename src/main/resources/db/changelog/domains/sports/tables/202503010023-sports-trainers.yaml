databaseChangeLog:

  # ── sports_trainer ────────────────────────────────────────────────────────
  - changeSet:
      id: "202503010023-create-sports-trainer"
      author: "mana-community-dev"
      labels: "sports,table,v1.0"
      context: "default"
      comment: "Create sports_trainer table"
      logicalFilePath: "db/changelog/domains/sports/tables/202503010023-sports-trainers.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: sports
                tableName: sports_trainer
      changes:
        - createTable:
            schemaName: sports
            tableName: sports_trainer
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sports_trainer
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(200)
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: sport
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: cert_body
                  type: VARCHAR(150)
              - column:
                  name: cert_number
                  type: VARCHAR(100)
              - column:
                  name: cert_year
                  type: INTEGER
              - column:
                  name: age_groups_coached
                  type: VARCHAR(100)
              - column:
                  name: bio
                  type: VARCHAR(1000)
              - column:
                  name: experience_years
                  type: INTEGER
              - column:
                  name: profile_pic_url
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: APPLIED
                  constraints:
                    nullable: false
              - column:
                  name: approved_by
                  type: BIGINT
              - column:
                  name: approved_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: rejection_reason
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
      rollback:
        - dropTable:
            schemaName: sports
            tableName: sports_trainer

  # ── trainer_slot ──────────────────────────────────────────────────────────
  - changeSet:
      id: "202503010023-create-trainer-slot"
      author: "mana-community-dev"
      labels: "sports,table,v1.0"
      context: "default"
      comment: "Create trainer_slot table"
      logicalFilePath: "db/changelog/domains/sports/tables/202503010023-sports-trainers.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: sports
                tableName: trainer_slot
      changes:
        - createTable:
            schemaName: sports
            tableName: trainer_slot
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trainer_slot
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sport
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: slot_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIME WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIME WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: slot_type
                  type: VARCHAR(20)
                  defaultValue: INDIVIDUAL
                  constraints:
                    nullable: false
              - column:
                  name: max_capacity
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: booked_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: venue_id
                  type: BIGINT
              - column:
                  name: venue_name
                  type: VARCHAR(150)
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: OPEN
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: community_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
      rollback:
        - dropTable:
            schemaName: sports
            tableName: trainer_slot

  # ── trainer_slot_booking ──────────────────────────────────────────────────
  - changeSet:
      id: "202503010023-create-trainer-slot-booking"
      author: "mana-community-dev"
      labels: "sports,table,v1.0"
      context: "default"
      comment: "Create trainer_slot_booking table"
      logicalFilePath: "db/changelog/domains/sports/tables/202503010023-sports-trainers.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: sports
                tableName: trainer_slot_booking
      changes:
        - createTable:
            schemaName: sports
            tableName: trainer_slot_booking
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trainer_slot_booking
              - column:
                  name: slot_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
