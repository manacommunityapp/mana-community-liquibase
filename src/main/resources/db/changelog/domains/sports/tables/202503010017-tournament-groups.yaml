databaseChangeLog:
  - changeSet:
      id: "202503010017-create-tournament-groups"
      author: "mana-community-dev"
      labels: "sports,table,v1.0"
      context: "default"
      comment: "Create tournament_groups table"
      logicalFilePath: "db/changelog/domains/sports/tables/202503010017-tournament-groups.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
