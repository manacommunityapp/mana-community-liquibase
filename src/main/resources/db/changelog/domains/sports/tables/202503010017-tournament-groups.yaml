                schemaName: sports
                tableName: tournament_groups
      changes:
        - createTable:
            schemaName: sports
            tableName: tournament_groups
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tournament_groups
              - column:
