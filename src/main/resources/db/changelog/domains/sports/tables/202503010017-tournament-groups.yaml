                    nullable: false
              - column:
                  name: group_code
                  type: VARCHAR(20)
              - column:
                  name: group_order
                  type: INTEGER
              - column:
                  name: max_teams
                  type: INTEGER
                  defaultValueNumeric: 4
              - column:
                  name: teams_advancing
                  type: INTEGER
                  defaultValueNumeric: 2
              - column:
                  name: is_completed
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: metadata
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
