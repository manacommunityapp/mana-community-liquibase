                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_by
                  type: BIGINT
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createTable:
            schemaName: sports
            tableName: tournament_group_teams
            columns:
