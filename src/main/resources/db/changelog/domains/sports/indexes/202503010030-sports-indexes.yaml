databaseChangeLog:
  - changeSet:
      id: "202503010030-idx-sports-venues-tenant-city"
      author: "mana-community-dev"
      labels: "sports,index,v1.0"
      context: "default"
      comment: "Create index on venues tenant and city"
      logicalFilePath: "db/changelog/domains/sports/indexes/202503010030-sports-indexes.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                indexName: idx_sports_venues_tenant_city
      changes:
        - sql:
            sql: CREATE INDEX idx_sports_venues_tenant_city ON sports.venues (tenant_id, city) WHERE deleted = FALSE;
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS sports.idx_sports_venues_tenant_city;

