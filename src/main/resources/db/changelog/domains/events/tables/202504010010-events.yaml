databaseChangeLog:
  - changeSet:
      id: "202504010010-events"
      author: "mana-community-dev"
      labels: "events,tables,v1.0"
      context: "default"
      comment: "Create events table"
      logicalFilePath: "db/changelog/domains/events/tables/202504010010-events.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: events
                tableName: events
      changes:
        - createTable:
            schemaName: events
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_events
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: event_code
                  type: VARCHAR(100)
              - column:
                  name: title
                  type: VARCHAR(400)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(400)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_events_slug
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: short_description
                  type: VARCHAR(1000)
              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
              - column:
                  name: sports_meta_id
                  type: BIGINT
              - column:
                  name: tournament_id
                  type: BIGINT
              - column:
                  name: organizer_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: co_organizers
                  type: JSONB
              - column:
                  name: venue_id
                  type: BIGINT
              - column:
                  name: venue_name
                  type: VARCHAR(300)
              - column:
                  name: venue_address
                  type: TEXT
              - column:
                  name: city
                  type: VARCHAR(100)
              - column:
                  name: country_code
                  type: CHAR(2)
              - column:
                  name: is_virtual
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: virtual_link
                  type: VARCHAR(1000)
              - column:
                  name: virtual_platform
                  type: VARCHAR(100)
              - column:
                  name: start_datetime
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_datetime
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: registration_open_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: registration_close_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: max_participants
                  type: INTEGER
              - column:
                  name: min_participants
                  type: INTEGER
                  defaultValueNumeric: 1
              - column:
                  name: current_registrations
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: waiting_list_count
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: is_free
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: entry_fee
                  type: DECIMAL(12,2)
                  defaultValueNumeric: 0
              - column:
                  name: currency_code
                  type: CHAR(3)
                  defaultValue: 'INR'
              - column:
                  name: early_bird_fee
                  type: DECIMAL(12,2)
              - column:
                  name: early_bird_deadline
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: event_status
                  type: VARCHAR(50)
                  defaultValue: 'DRAFT'
              - column:
                  name: banner_url
                  type: VARCHAR(500)
              - column:
                  name: gallery_urls
                  type: JSONB
              - column:
                  name: tags
                  type: JSONB
              - column:
                  name: is_featured
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: invite_only
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: allowed_roles
                  type: JSONB
              - column:
                  name: rules
                  type: TEXT
              - column:
                  name: terms_and_conditions
                  type: TEXT
              - column:
                  name: dress_code
                  type: VARCHAR(200)
              - column:
                  name: what_to_bring
                  type: TEXT
              - column:
                  name: parking_info
                  type: TEXT
              - column:
                  name: contact_name
                  type: VARCHAR(200)
              - column:
                  name: contact_email
                  type: VARCHAR(255)
              - column:
                  name: contact_phone
                  type: VARCHAR(30)
              - column:
                  name: social_share_url
                  type: VARCHAR(500)
              - column:
                  name: metadata
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_by
                  type: BIGINT
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: events
            tableName: events
            columnNames: tenant_id, event_code
            constraintName: uq_events_tenant_event_code
      rollback:
        - dropTable:
            schemaName: events
            tableName: events
