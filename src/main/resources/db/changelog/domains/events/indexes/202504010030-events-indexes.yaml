databaseChangeLog:
  - changeSet:
      id: "202504010030-idx-events-tenant-status"
      author: "mana-community-dev"
      labels: "events,index,v1.0"
      context: "default"
      comment: "Create index on events tenant status date"
      logicalFilePath: "db/changelog/domains/events/indexes/202504010030-events-indexes.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                indexName: idx_events_tenant_status_date
      changes:
        - createIndex:
            indexName: idx_events_tenant_status_date
            schemaName: events
            tableName: events
            columns:
              - column: { name: tenant_id }
              - column: { name: event_status }
              - column: { name: start_datetime }
      rollback:
        - dropIndex:
            indexName: idx_events_tenant_status_date
            schemaName: events
            tableName: events

