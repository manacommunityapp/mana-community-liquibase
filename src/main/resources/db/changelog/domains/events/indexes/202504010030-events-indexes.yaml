  - changeSet:
      id: "202504010030-idx-events-tags"
      author: "mana-community-dev"
      labels: "events,index,v1.0"
      context: "default"
      comment: "Create GIN index on events tags"
      logicalFilePath: "db/changelog/domains/events/indexes/202504010030-events-indexes.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                indexName: idx_events_tags
      changes:
        - sql:
            sql: CREATE INDEX idx_events_tags ON events.events USING GIN (tags) WHERE tags IS NOT NULL;
      rollback:
        - dropIndex:
            indexName: idx_events_tags
            schemaName: events
            tableName: events

