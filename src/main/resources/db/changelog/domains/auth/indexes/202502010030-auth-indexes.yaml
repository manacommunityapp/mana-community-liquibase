databaseChangeLog:
  - changeSet:
      id: "202502010030-idx-users-tenant-email"
      author: "mana-community-dev"
      labels: "auth,index,v1.0"
      context: "default"
      comment: "Index for users tenant and email"
      logicalFilePath: "db/changelog/domains/auth/indexes/202502010030-auth-indexes.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          not:
            - indexExists:
                indexName: idx_users_tenant_email
      changes:
        - createIndex:
            indexName: idx_users_tenant_email
            schemaName: auth
            tableName: users
            unique: true
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: email
            where: deleted=FALSE
      rollback:
        - dropIndex:
            indexName: idx_users_tenant_email
            schemaName: auth
            tableName: users

