databaseChangeLog:
  - changeSet:
      id: "202502010017-create-password-history"
      author: "mana-community-dev"
      labels: "auth,table,password_history,v1.0"
      context: "default"
      comment: "Create password history table"
      logicalFilePath: "db/changelog/domains/auth/tables/202502010017-password-history.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: auth
                tableName: password_history
      changes:
        - createTable:
            schemaName: auth
            tableName: password_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_history_user
                    references: auth.users(id)
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: change_reason
                  type: VARCHAR(100)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_by
                  type: BIGINT
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: auth
            tableName: password_history
