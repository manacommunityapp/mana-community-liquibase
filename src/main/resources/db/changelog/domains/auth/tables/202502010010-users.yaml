databaseChangeLog:
  - changeSet:
      id: "202502010010-create-users"
      author: "mana-community-dev"
      labels: "auth,table,users,v1.0"
      context: "default"
      comment: "Create users table"
      logicalFilePath: "db/changelog/domains/auth/tables/202502010010-users.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: auth
                tableName: users
      changes:
        - createTable:
            schemaName: auth
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_tenant
                    references: platform_master.tenants(id)
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    unique: true
              - column:
                  name: phone_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: password_hash
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: password_salt
                  type: VARCHAR(200)
              - column:
                  name: avatar_url
                  type: VARCHAR(500)
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(200)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: gender
                  type: VARCHAR(30)
              - column:
                  name: national_id
                  type: VARCHAR(100)
              - column:
                  name: nationality
                  type: CHAR(2)
              - column:
                  name: preferred_language
                  type: VARCHAR(10)
                  defaultValue: 'en'
              - column:
                  name: timezone
                  type: VARCHAR(100)
                  defaultValue: 'Asia/Kolkata'
              - column:
                  name: is_system_user
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: last_login_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: last_login_ip
                  type: VARCHAR(45)
              - column:
                  name: failed_login_count
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: locked_until
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: must_change_password
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: account_type
                  type: VARCHAR(50)
                  defaultValue: 'STANDARD'
              - column:
                  name: oauth_provider
                  type: VARCHAR(50)
              - column:
                  name: oauth_subject
                  type: VARCHAR(500)
              - column:
                  name: referral_code
                  type: VARCHAR(50)
                  constraints:
                    unique: true
              - column:
                  name: referred_by_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_users_referred_by
                    references: auth.users(id)
              - column:
                  name: metadata
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_by
                  type: BIGINT
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: auth
            tableName: users
