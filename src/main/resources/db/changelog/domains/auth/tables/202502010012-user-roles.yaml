databaseChangeLog:
  - changeSet:
      id: "202502010012-create-user-roles"
      author: "mana-community-dev"
      labels: "auth,table,user_roles,v1.0"
      context: "default"
      comment: "Create user roles table"
      logicalFilePath: "db/changelog/domains/auth/tables/202502010012-user-roles.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: auth
                tableName: user_roles
      changes:
        - createTable:
            schemaName: auth
            tableName: user_roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_user
                    references: auth.users(id)
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_role
                    references: platform_master.roles(id)
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: context
                  type: VARCHAR(100)
              - column:
                  name: context_entity_type
                  type: VARCHAR(100)
              - column:
                  name: context_entity_id
                  type: BIGINT
              - column:
                  name: granted_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: granted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_by
                  type: BIGINT
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_user_roles_unique
            schemaName: auth
            tableName: user_roles
            unique: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: role_id
              - column:
                  name: tenant_id
              - column:
                  name: context_entity_id
            where: deleted = FALSE
      rollback:
        - dropIndex:
            indexName: idx_user_roles_unique
            schemaName: auth
            tableName: user_roles
        - dropTable:
            schemaName: auth
            tableName: user_roles
