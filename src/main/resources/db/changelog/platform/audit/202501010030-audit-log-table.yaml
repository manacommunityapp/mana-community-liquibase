databaseChangeLog:
  - changeSet:
      id: "202501010030-audit-log-table"
      author: "mana-community-dev"
      labels: "platform,schema,v1.0"
      context: "default"
      comment: "Create audit log table"
      logicalFilePath: "db/changelog/platform/audit/202501010030-audit-log-table.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: platform_audit
                tableName: audit_log
      changes:
        - createTable:
            schemaName: platform_audit
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: BIGINT
              - column:
                  name: entity_uuid
                  type: UUID
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: old_values
                  type: JSONB
              - column:
                  name: new_values
                  type: JSONB
              - column:
                  name: changed_fields
                  type: TEXT[]
              - column:
                  name: performed_by
                  type: BIGINT
              - column:
                  name: performed_by_email
                  type: VARCHAR(255)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: TEXT
              - column:
                  name: request_id
                  type: VARCHAR(100)
              - column:
                  name: session_id
                  type: VARCHAR(255)
              - column:
                  name: correlation_id
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'SUCCESS'
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: duration_ms
                  type: INTEGER
              - column:
                  name: metadata
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: |
              CREATE INDEX idx_audit_log_old_values ON platform_audit.audit_log USING GIN (old_values);
              CREATE INDEX idx_audit_log_new_values ON platform_audit.audit_log USING GIN (new_values);
        - createIndex:
            indexName: idx_audit_log_entity
            schemaName: platform_audit
            tableName: audit_log
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: entity_type
              - column:
                  name: entity_id
        - createIndex:
            indexName: idx_audit_log_action_time
            schemaName: platform_audit
            tableName: audit_log
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: action
              - column:
                  name: created_at
      rollback:
        - dropTable:
            schemaName: platform_audit
            tableName: audit_log
