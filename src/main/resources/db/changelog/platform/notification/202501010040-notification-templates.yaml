databaseChangeLog:
  - changeSet:
      id: "202501010040-notification-templates"
      author: "mana-community-dev"
      labels: "platform,schema,v1.0"
      context: "default"
      comment: "Create notification tables"
      logicalFilePath: "db/changelog/platform/notification/202501010040-notification-templates.yaml"
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          not:
            - tableExists:
                schemaName: platform_notification
                tableName: notification_templates
      changes:
        - createTable:
            schemaName: platform_notification
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(300)
              - column:
                  name: channel
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: VARCHAR(10)
                  defaultValue: 'en'
              - column:
                  name: subject
                  type: VARCHAR(500)
              - column:
                  name: body_template
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: body_format
                  type: VARCHAR(20)
                  defaultValue: 'HTML'
              - column:
                  name: variables
                  type: JSONB
              - column:
                  name: is_system_template
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: deleted_by
                  type: BIGINT
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: platform_notification
            tableName: notification_templates
            constraintName: uq_notif_template_tenant_code_ch_lang
            columnNames: tenant_id, code, channel, language
        - sql:
            sql: SELECT platform_master.apply_updated_at_trigger('platform_notification', 'notification_templates');

        - createTable:
            schemaName: platform_notification
            tableName: notification_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: template_id
                  type: BIGINT
              - column:
                  name: recipient_id
                  type: BIGINT
              - column:
                  name: recipient_email
                  type: VARCHAR(255)
              - column:
                  name: recipient_phone
                  type: VARCHAR(30)
              - column:
                  name: channel
                  type: VARCHAR(50)
              - column:
                  name: subject
                  type: VARCHAR(500)
              - column:
                  name: body
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: sent_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: delivered_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: retry_count
                  type: INTEGER
              - column:
                  name: metadata
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            schemaName: platform_notification
            tableName: notification_log
        - dropTable:
            schemaName: platform_notification
            tableName: notification_templates
