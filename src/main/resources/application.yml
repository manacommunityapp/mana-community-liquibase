# ═══════════════════════════════════════════════════════════
#  Mana Community — Enterprise Liquibase Migration Service
#  Base application configuration
# ═══════════════════════════════════════════════════════════
spring:
  application:
    name: mana-community-liquibase

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manacommunity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ManaLiquibasePool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-root.yaml
    default-schema: platform_master
    liquibase-schema: liquibase_meta
    database-change-log-table: DATABASE_CHANGE_LOG
    database-change-log-lock-table: DATABASE_CHANGE_LOG_LOCK
    contexts: ${LIQUIBASE_CONTEXTS:default}
    labels: ${LIQUIBASE_LABELS:}
    drop-first: false
    test-rollback-on-update: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,liquibase
  endpoint:
    health:
      show-details: always
    liquibase:
      enabled: true

logging:
  level:
    liquibase: INFO
    com.manacommunity: DEBUG
    org.springframework.boot: WARN
