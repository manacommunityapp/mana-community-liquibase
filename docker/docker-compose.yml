version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: manacommunity-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: manacommunity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mana@community@8008
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manacommunity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mana-network

  liquibase-migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: manacommunity-liquibase-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/manacommunity_db
      DB_USERNAME: postgres
      DB_PASSWORD: mana@community@8008
      LIQUIBASE_CONTEXTS: default,local,dev
      SPRING_PROFILES_ACTIVE: local
    restart: on-failure
    networks:
      - mana-network

volumes:
  pgdata:

networks:
  mana-network:
    driver: bridge
