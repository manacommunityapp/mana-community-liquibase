version: '3.8'

services:
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ${PROD_DB_NAME}
  #     POSTGRES_USER: ${PROD_DB_USER}
  #     POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}

  liquibase-migration:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/mana-community-liquibase:latest
    container_name: manacommunity-liquibase-prod
    environment:
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/manacommunity_db?ssl=true&sslmode=require
      DB_USERNAME: ${PROD_DB_USER}
      DB_PASSWORD: ${PROD_DB_PASSWORD}
      LIQUIBASE_CONTEXTS: default,prod
      SPRING_PROFILES_ACTIVE: prod
    restart: "no" # one-time migration job
    networks:
      - mana-network-prod

networks:
  mana-network-prod:
    driver: bridge
