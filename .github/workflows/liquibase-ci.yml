name: Liquibase Database Migration CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manacommunity_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Validate Liquibase
        run: ./mvnw liquibase:validate -Plocal

  diff:
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Status against Dev
        env:
          DB_URL: jdbc:postgresql://${{ secrets.DEV_DB_HOST }}:5432/manacommunity_db
          DB_USERNAME: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASS }}
        run: ./mvnw liquibase:status -Pdev

  migrate-dev:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: diff
    concurrency: dev-migration
    environment: dev
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Migrate Dev
        env:
          DB_URL: jdbc:postgresql://${{ secrets.DEV_DB_HOST }}:5432/manacommunity_db
          DB_USERNAME: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASS }}
        run: ./mvnw liquibase:update -Pdev

  migrate-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: diff
    concurrency: prod-migration
    environment:
      name: prod
      url: https://your-prod-url
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Migrate Prod
        env:
          DB_URL: jdbc:postgresql://${{ secrets.PROD_RDS_ENDPOINT }}:5432/manacommunity_db
          DB_USERNAME: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASS }}
        run: ./mvnw liquibase:update -Pprod

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Rollback N changesets
        run: echo "Manual rollback triggered - to be implemented with rollbackCount"
